version: '3.8'

services:
  archagent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: archagent_service
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - ./.memory:/app/.memory
      - ./logs:/app/logs
    restart: unless-stopped
